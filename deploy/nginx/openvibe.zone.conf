## ═══════════════════════════════════════════════════════════════
## openvibe.zone — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.zone.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 5050, systemd unit openvibe-zone) renders every page and serves
## the API; nginx terminates TLS with openvibe.zone's own certificate (openvibe.zone and *.openvibe.zone: a repo vhost
## uses the certificate that really covers its name, or Cloudflare answers 526), rate-limits sign-in and the API, keeps
## /internal/ off the internet, and compresses text. api.openvibe.zone is the same site once its DNS record exists;
## www.openvibe.zone redirects to the apex. The bytes of a zone never pass here: they go to s3.openvibe.media.
##
## No proxy_cache: the app decides cacheability per response (public for the pages rendered for anonymous
## visitors; private, no-store for everything personal). Never log request bodies here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=zone_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=zone_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.zone api.openvibe.zone www.openvibe.zone;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.zone$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.zone;
    ssl_certificate     /etc/letsencrypt/live/openvibe.zone/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.zone/privkey.pem;
    return 301 https://openvibe.zone$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.zone api.openvibe.zone;

    ssl_certificate     /etc/letsencrypt/live/openvibe.zone/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.zone/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.zone.access.log;
    error_log  /var/log/nginx/openvibe.zone.error.log;

    # The API's JSON body cap is 32 KB and a console form 8 KB; leave room for the headers.
    client_max_body_size 160k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints ───────────────────────
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        limit_req zone=zone_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5050;
    }

    location /auth/ {
        limit_req zone=zone_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5050;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=zone_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5050;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:5050/metrics) ──
    location ~* ^/metrics(/|$) { return 404; }

    # ── OpenVibe.Events' delivery route: loopback only (POST /internal/events) ──
    # Events posts to http://127.0.0.1:5050/internal/events directly; never proxied from outside (ADR-033).
    location ~* ^/internal(/|$) { return 404; }

    # ── Pages, docs, robots.txt, sitemap, static assets ─────
    location / {
        proxy_pass http://127.0.0.1:5050;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
